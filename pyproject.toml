[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "generic-kleinanzeigen-parser"
version = "0.45.1"
description = "Reusable Kleinanzeigen parser module with stable module-v1 API, browser-safe CORS and diagnostics"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Jan Leduc" }]
keywords = ["kleinanzeigen", "parser", "cloudflare-workers", "pwa", "matching", "scoring", "traffic-light", "module-api", "evercade", "snes", "debug", "cors", "diagnostics"]
dependencies = [
  "PyYAML>=6.0",
  "beautifulsoup4>=4.12",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
]

[project.urls]
Homepage = "https://github.com/f6yv7sgtgw-wq/GenericParser"
Documentation = "https://github.com/f6yv7sgtgw-wq/GenericParser/blob/main/docs/API_0.45.1.md"
Changelog = "https://github.com/f6yv7sgtgw-wq/GenericParser/blob/main/CHANGELOG.md"
Source = "https://github.com/f6yv7sgtgw-wq/GenericParser"
Issues = "https://github.com/f6yv7sgtgw-wq/GenericParser/issues"

[project.scripts]
generic-parser = "generic_parser.cli:main"
generic-parser-web = "generic_parser.web.app:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
generic_parser = [
  "py.typed",
  "web/templates/*.html",
  "web/static/*.css",
  "web/static/*.js",
  "web/fixtures/*.html",
]

[tool.pytest.ini_options]
markers = ["live: expliziter Live-Test gegen Kleinanzeigen"]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
cloudflare = [
  "workers-py>=1.15,<2",
  "workers-runtime-sdk",
]
