[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "generic-kleinanzeigen-parser"
version = "0.2.0a1"
description = "Wiederverwendbarer Kleinanzeigen-Parser für Sammlungsprojekte"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Jan Leduc" }
]
dependencies = [
  "PyYAML>=6.0",
  "beautifulsoup4>=4.12",
  "httpx>=0.27",
]

[project.scripts]
generic-parser = "generic_parser.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
generic_parser = ["py.typed"]

[tool.pytest.ini_options]
markers = ["live: expliziter Live-Test gegen Kleinanzeigen"]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
