[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "generic-kleinanzeigen-parser"
version = "1.1.0"
description = "Reusable multi-source marketplace parser for Kleinanzeigen and Vinted with module-v1 API, Evercade/SNES adapters and Cloudflare Worker diagnostics"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Jan Leduc" }]
keywords = ["kleinanzeigen", "vinted", "parser", "cloudflare-workers", "pwa", "matching", "scoring", "traffic-light", "module-api", "evercade", "snes", "debug", "cors"]
dependencies = [
  "PyYAML>=6.0",
  "beautifulsoup4>=4.12",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
]

[project.scripts]
generic-parser = "generic_parser.cli:main"
generic-parser-web = "generic_parser.web.app:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
generic_parser = [
  "py.typed",
  "web/templates/*.html",
  "web/static/*.css",
  "web/static/*.js",
  "web/fixtures/*.html",
]

[tool.pytest.ini_options]
markers = ["live: expliziter Live-Test gegen externe Marktplatzquellen"]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
cloudflare = [
  "workers-py>=1.15,<2",
  "workers-runtime-sdk",
]
