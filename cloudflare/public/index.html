<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>GenericParser 0.38</title><link rel="manifest" href="./manifest.webmanifest?v=0.38"><link rel="stylesheet" href="./app.css?v=0.38"></head><body><main class="app-shell">
<header class="hero"><div><p class="eyebrow">Kleinanzeigen · Matching & Scoring</p><h1>GenericParser <span>0.38</span></h1><p class="subtitle">Dynamischer Suchumfang: Bis 100 Treffer vollständig, bis 500 automatisch fortgesetzt, darüber transparenter Ausschnitt.</p></div><div id="connection" class="status"><span></span> Online</div></header>
<section class="card search-card"><div class="row between"><h2>Suchprofil</h2><button id="install-button" class="ghost hidden">Installieren</button></div>
<label>Profilname<input id="profile-name" autocomplete="off"></label><label>Suchbegriff<input id="query" autocomplete="off"></label>
<div class="details-grid"><label>Pflichtbegriffe<input id="required-terms"></label><label>Ausschlussbegriffe<input id="excluded-terms"></label><label>Modell-/Schreibvarianten<input id="model-patterns"></label><label>Marken<input id="brands"></label><label>Maximalpreis €<input id="max-price" inputmode="decimal"></label><label>Richtwert €<input id="market-value" inputmode="decimal"></label></div>
<details><summary>Ort, Umfang und Optionen</summary><div class="details-grid"><label>PLZ<input id="postal-code" inputmode="numeric" maxlength="5"></label><label>Location-ID<input id="location-id" inputmode="numeric"></label><label>Radius km<input id="radius-km" inputmode="numeric"></label><label>Max. Rohfunde<input id="max-results" name="gp-max-results-038" inputmode="numeric" placeholder="leer = dynamisch" min="1" autocomplete="off"></label><label>Sortierung<select id="sort-by"><option value="relevance">Relevanz</option><option value="date">Neueste</option><option value="price_asc">Preis aufsteigend</option><option value="price_desc">Preis absteigend</option></select></label></div><label><input id="accept-bundles" type="checkbox"> Konvolute akzeptieren</label><label><input id="accept-incomplete" type="checkbox"> Defekte/unvollständige Treffer akzeptieren</label><label><input id="include-review" type="checkbox" checked> Prüffälle anzeigen</label><label><input id="include-rejected" type="checkbox" checked> Abgelehnte Ergebnisse anzeigen</label><label>Zugriffstoken<input id="token" type="password"></label></details>
<div class="actions"><button id="search-button" class="primary">Live-Suche starten</button><button id="save-profile" class="secondary">Profil speichern</button><button id="demo-button" class="secondary" type="button">Demo anzeigen</button></div><label>Gespeicherte Profile<select id="profiles"><option value="">– auswählen –</option></select></label></section>
<section id="message" class="message hidden"></section><section id="summary" class="metrics hidden"></section><section id="diagnostics-card" class="card hidden"><div class="row between"><h2>Diagnose & Suchumfang</h2><span id="worker-version" class="chip"></span></div><div id="urls" class="urls"></div><div id="diagnostics"></div></section><section id="results" class="results"></section><footer><span>GenericParser Mobile</span><a href="./health" target="_blank">Worker-Status</a></footer></main><script src="./app.js?v=0.38" defer></script></body></html>
