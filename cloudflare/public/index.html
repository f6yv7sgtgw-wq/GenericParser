<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>GenericParser 0.33</title><link rel="manifest" href="./manifest.webmanifest?v=0.33"><link rel="stylesheet" href="./app.css?v=0.33"></head><body><main class="app-shell">
<header class="hero"><div><p class="eyebrow">Kleinanzeigen · Matching & Scoring</p><h1>GenericParser <span>0.33</span></h1><p class="subtitle">Mehrseitige Suche mit sichtbarer Pagination und eindeutigem Abbruchgrund.</p></div><div id="connection" class="status"><span></span> Online</div></header>
<section class="card search-card"><div class="row between"><h2>Suchprofil</h2><button id="install-button" class="ghost hidden">Installieren</button></div>
<label>Profilname<input id="profile-name" name="gp-profile-name-033" value="" autocomplete="off"></label><label>Suchbegriff<input id="query" name="gp-query-033" value="" autocomplete="off"></label>
<div class="details-grid"><label>Pflichtbegriffe<input id="required-terms" name="gp-required-033" value="" autocomplete="off"></label><label>Ausschlussbegriffe<input id="excluded-terms" name="gp-excluded-033" value="" autocomplete="off"></label><label>Modell-/Schreibvarianten<input id="model-patterns" name="gp-models-033" value="" autocomplete="off"></label><label>Marken<input id="brands" name="gp-brands-033" value="" autocomplete="off"></label><label>Maximalpreis €<input id="max-price" name="gp-max-price-033" value="" inputmode="decimal" autocomplete="off"></label><label>Richtwert €<input id="market-value" name="gp-market-value-033" value="" inputmode="decimal" autocomplete="off"></label></div>
<details><summary>Ort, Umfang und Optionen</summary><div class="details-grid"><label>PLZ<input id="postal-code" name="gp-postal-033" value="" inputmode="numeric" maxlength="5" autocomplete="off"></label><label>Location-ID<input id="location-id" name="gp-location-033" value="" inputmode="numeric" autocomplete="off"></label><label>Radius km<input id="radius-km" name="gp-radius-033" value="" inputmode="numeric" autocomplete="off"></label><label>Max. Rohfunde<input id="max-results" name="gp-max-results-033" value="" inputmode="numeric" placeholder="leer = alle" min="1" autocomplete="off"></label><label>Sortierung<select id="sort-by"><option value="relevance">Relevanz</option><option value="date">Neueste</option><option value="price_asc">Preis aufsteigend</option><option value="price_desc">Preis absteigend</option></select></label></div><label><input id="accept-bundles" type="checkbox"> Konvolute akzeptieren</label><label><input id="accept-incomplete" type="checkbox"> Defekte/unvollständige Treffer akzeptieren</label><label><input id="include-review" type="checkbox" checked> Prüffälle anzeigen</label><label><input id="include-rejected" type="checkbox"> Abgelehnte Treffer anzeigen</label><label>Zugriffstoken<input id="token" name="gp-token-033" type="password" autocomplete="new-password"></label></details>
<div class="actions"><button id="search-button" class="primary">Live-Suche starten</button><button id="save-profile" class="secondary">Profil speichern</button><button id="demo-button" class="secondary" type="button">Demo anzeigen</button></div><label>Gespeicherte Profile<select id="profiles"><option value="">– auswählen –</option></select></label></section>
