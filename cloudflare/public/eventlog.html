<!doctype html>
<html lang="de" data-page="eventlog">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090a0f">
  <title>GenericParser Eventlog</title>
  <link rel="stylesheet" href="./app.css">
  <link rel="stylesheet" href="./layout-0409.css">
  <link rel="stylesheet" href="./ui-133.css">
</head>
<body>
<div class="sticky-shell">
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <div>
          <div class="title-row"><h1>Log &amp; Diagnose</h1><span class="version-badge">Version <span data-version>…</span></span></div>
          <p>GenericParser</p>
        </div>
      </div>
      <div class="header-actions"><a class="header-link" href="./favorites.html">Favoriten <span class="favorite-count" data-favorite-count>0</span></a><a class="header-link" href="./">Zur Suche</a></div>
    </div>
  </header>
</div>

<main class="app-shell eventlog-shell">
  <section class="card eventlog-panel">
    <div class="section-heading">
      <div><p class="eyebrow">Browseraktivität</p><h2>Ereignisse</h2></div>
      <button id="clear-log" class="danger-button">Log löschen</button>
    </div>
    <div class="eventlog-actions">
      <button id="refresh-log" class="primary">Aktualisieren</button>
      <button id="copy-log" class="secondary">Log kopieren</button>
    </div>
    <div id="version-check" class="diagnostic">Runtime-Identität wird geladen …</div>
    <div id="log-summary" class="diagnostic"></div>
    <div id="event-log"></div>
  </section>
  <footer><span>GenericParser · Build …</span></footer>
</main>
<script src="./build-identity-0450.js" defer></script>
<script src="./favorites-store-150.js" defer></script>
<script src="./eventlog-0450.js" defer></script>
</body>
</html>
