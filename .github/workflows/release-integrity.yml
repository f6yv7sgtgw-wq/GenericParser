name: GenericParser release integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generic-parser-release-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install project and tests
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Validate release metadata and documentation
        run: python scripts/check_release_metadata.py
      - name: Compile active Python modules
        run: |
          python -m py_compile \
            src/generic_parser/module_api.py \
            src/generic_parser/integrations/__init__.py \
            src/generic_parser/integrations/evercade.py \
            src/generic_parser/integrations/snes.py \
            src/generic_parser/build_identity_v0452.py \
            src/generic_parser/search_service_v0450.py \
            src/generic_parser/cloudflare_v0451.py \
            src/generic_parser/cloudflare_worker.py \
            scripts/check_deployment.py \
            scripts/check_release_metadata.py \
            scripts/run_release_tests.py
      - name: Validate active browser assets
        run: |
          node --check cloudflare/public/build-identity-0452.js
          node --check cloudflare/public/controller-0450.js
          node --check cloudflare/public/module-debug-0450.js
          node --check cloudflare/public/auto-resume-0450.js
          node --check cloudflare/public/eventlog-0450.js
          node --check cloudflare/public/service-worker.js
          node tests/check_module_debug_v0450.js
      - name: Run current network-free release suite
        run: python scripts/run_release_tests.py
