name: GenericParser 0.45.2 Build 4 integrity (historical)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build4-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install project and tests
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Compile historical Build 4 runtime
        run: python -m py_compile src/generic_parser/build_identity_v0452.py src/generic_parser/cloudflare_v0452.py scripts/check_deployment.py
      - name: Check browser controller syntax
        run: node --check cloudflare/public/controller-0450.js
      - name: Run historical Build 4 regressions
        run: pytest -q tests/test_build3_v0452.py tests/test_search_service_v0444.py
