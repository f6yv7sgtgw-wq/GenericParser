name: GenericParser 0.44.6 reference rollback

on:
  push:
    branches: [main]
    paths:
      - 'src/generic_parser/cloudflare_worker.py'
      - 'src/generic_parser/cloudflare_v0446.py'
      - 'src/generic_parser/search_service_v0446.py'
      - 'src/generic_parser/build_identity_v0446.py'
      - 'cloudflare/public/controller-0446.js'
      - 'cloudflare/public/build-identity-0446.js'
      - 'tests/test_reference_rollback_v0446.py'
      - '.github/workflows/reference-0446.yml'
  workflow_dispatch:

jobs:
  reference-rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install -U pip pytest fastapi pydantic httpx beautifulsoup4 PyYAML
      - name: Compile 0.44.6 modules
        run: |
          python -m py_compile \
            src/generic_parser/cloudflare_worker.py \
            src/generic_parser/cloudflare_v0446.py \
            src/generic_parser/search_service_v0446.py \
            src/generic_parser/build_identity_v0446.py
      - name: Run reference rollback tests
        run: pytest -q tests/test_reference_rollback_v0446.py
