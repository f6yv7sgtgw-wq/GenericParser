name: GenericParser 0.44.6.2 historical reference

on:
  workflow_dispatch:

jobs:
  historical-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: python -m pip install -U pip pytest fastapi pydantic httpx beautifulsoup4 PyYAML
      - name: Compile historical 0.44.6.2 modules
        run: |
          python -m py_compile \
            src/generic_parser/cloudflare_v04462.py \
            src/generic_parser/search_service_v04462.py \
            src/generic_parser/build_identity_v04462.py
      - name: Check historical browser scripts
        run: |
          node --check cloudflare/public/controller-04462.js
          node --check cloudflare/public/auto-resume-04462.js
          node --check cloudflare/public/eventlog-04462.js
          node --check cloudflare/public/build-identity-04462.js
