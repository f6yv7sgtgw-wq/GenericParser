name: eBay production access gate

on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - .github/workflows/ebay-production-gate.yml

permissions:
  contents: read

jobs:
  ebay-production-gate:
    if: github.head_ref == 'agent/ebay-production-gate-20260809'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
      EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}

    steps:
      - name: Verify secret configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${EBAY_CLIENT_ID:-}" || -z "${EBAY_CLIENT_SECRET:-}" ]]; then
            echo "::error::EBAY_CLIENT_ID or EBAY_CLIENT_SECRET is not configured."
            exit 1
          fi

      - name: Mint token and send exactly one Browse request
        shell: bash
        run: |
          set -euo pipefail

          token_file="${RUNNER_TEMP}/ebay-token.json"
          browse_file="${RUNNER_TEMP}/ebay-browse.json"

          token_http="$(
            curl --silent --show-error               --connect-timeout 10               --max-time 30               --request POST               --user "${EBAY_CLIENT_ID}:${EBAY_CLIENT_SECRET}"               --header 'Content-Type: application/x-www-form-urlencoded'               --data-urlencode 'grant_type=client_credentials'               --data-urlencode 'scope=https://api.ebay.com/oauth/api_scope'               --output "${token_file}"               --write-out '%{http_code}'               'https://api.ebay.com/identity/v1/oauth2/token'
          )"
          echo "OAuth HTTP status: ${token_http}"

          if [[ "${token_http}" != "200" ]]; then
            python3 - "${token_file}" <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          try:
              body = json.loads(path.read_text(encoding="utf-8"))
          except Exception:
              body = {}
          error = body.get("error", "unknown_oauth_error")
          description = body.get("error_description", "No description returned")
          print(f"::error::eBay OAuth failed: {error}: {description}")
          PY
            exit 1
          fi

          access_token="$(
            python3 - "${token_file}" <<'PY'
          import json
          import pathlib
          import sys

          body = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(body.get("access_token", ""))
          PY
          )"
          if [[ -z "${access_token}" ]]; then
            echo "::error::eBay returned HTTP 200 without an access token."
            exit 1
          fi

          browse_http="$(
            curl --silent --show-error               --connect-timeout 10               --max-time 30               --get               --header "Authorization: Bearer ${access_token}"               --header 'X-EBAY-C-MARKETPLACE-ID: EBAY_DE'               --header 'Accept-Language: de-DE'               --data-urlencode 'q=Evercade'               --data-urlencode 'limit=1'               --output "${browse_file}"               --write-out '%{http_code}'               'https://api.ebay.com/buy/browse/v1/item_summary/search'
          )"
          unset access_token
          echo "Browse HTTP status: ${browse_http}"

          if [[ "${browse_http}" != "200" ]]; then
            python3 - "${browse_file}" <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          try:
              body = json.loads(path.read_text(encoding="utf-8"))
          except Exception:
              body = {}
          errors = body.get("errors") or []
          if errors:
              first = errors[0]
              code = first.get("errorId", "unknown")
              domain = first.get("domain", "unknown")
              message = first.get("message", "No message returned")
              print(f"::error::eBay Browse failed: {domain}/{code}: {message}")
          else:
              print("::error::eBay Browse failed without a structured error response.")
          PY
            exit 1
          fi

          python3 - "${browse_file}" <<'PY'
          import json
          import pathlib
          import sys

          body = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          summaries = body.get("itemSummaries") or []
          total = body.get("total")
          print(f"Production gate passed: marketplace=EBAY_DE, limit=1, returned={len(summaries)}, total={total}")
          PY
