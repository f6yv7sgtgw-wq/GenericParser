name: Verify GenericParser 1.0.0 live

on:
  pull_request:
    paths:
      - ".github/workflows/verify-live-100.yml"

permissions:
  contents: read

env:
  RELEASE_COMMIT: eef9bcf88f928ebba1cedfaf43cb565834e08572

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Wait for deployed 1.0.0 identity
        env:
          DEPLOYMENT_URL: ${{ vars.CLOUDFLARE_WORKER_URL }}
        shell: bash
        run: |
          test -n "$DEPLOYMENT_URL" || { echo "CLOUDFLARE_WORKER_URL fehlt"; exit 1; }
          for i in $(seq 1 30); do
            body="$(curl -fsS --max-time 15 "$DEPLOYMENT_URL/health" 2>/dev/null || true)"
            if printf '%s' "$body" | grep -q 'gp-100-20260808-1'; then
              printf '%s\n' "$body"
              exit 0
            fi
            sleep 10
          done
          echo "GenericParser 1.0.0 wurde nicht live erkannt"
          exit 1
      - name: Verify health, CORS and live Evercade/SNES paths
        env:
          DEPLOYMENT_URL: ${{ vars.CLOUDFLARE_WORKER_URL }}
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
        run: python scripts/check_deployment.py "$DEPLOYMENT_URL" --live-search --browser-origin https://f6yv7sgtgw-wq.github.io
      - name: Build exact 1.0.0 source ZIP
        shell: bash
        run: |
          git archive --format=zip --output GenericParser-1.0.0.zip "$RELEASE_COMMIT"
          sha256sum GenericParser-1.0.0.zip | tee GenericParser-1.0.0.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: GenericParser-1.0.0
          path: |
            GenericParser-1.0.0.zip
            GenericParser-1.0.0.sha256
          if-no-files-found: error
