name: GenericParser release integrity

on:
  pull_request:
    paths:
      - "src/**"
      - "pocs/vinted-browser/**"
      - "cloudflare/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - "VERSION.json"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  release-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: "3.13"}
      - uses: actions/setup-node@v6
        with: {node-version: "22"}
      - name: Install project and tests
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Prove Kleinanzeigen core and multi-source orchestration are unchanged
        run: |
          git diff --exit-code origin/main -- \
            src/generic_parser/search_service_v0444.py \
            src/generic_parser/search_service_v0450.py \
            src/generic_parser/search_service_v111_runtime.py
      - name: Compile active runtime and release identity
        run: python -m py_compile src/generic_parser/release_identity.py src/generic_parser/build_identity_v0450.py src/generic_parser/build_identity_v0452.py src/generic_parser/cloudflare_v0450.py src/generic_parser/cloudflare_v0452.py src/generic_parser/search_service_v0450.py src/generic_parser/search_service_v111_runtime.py src/generic_parser/vinted_adapter.py src/generic_parser/vinted_enrichment.py scripts/check_deployment.py
      - name: Check browser syntax
        run: |
          node --check cloudflare/public/controller-0450.js
          node --check cloudflare/public/vinted-background-132.js
          node --check cloudflare/public/source-colors-110.js
          node --check pocs/vinted-browser/src/index.js
      - name: Run stable, bridge and Vinted regression tests
        run: pytest -q tests/test_release_100.py tests/test_release_132.py tests/test_search_service_v0444.py tests/test_vinted_multi_source.py tests/test_vinted_browser_production.py tests/test_vinted_service_binding_122.py
      - name: Validate metadata from single release identity
        run: |
          python - <<'PY'
          import json
          from generic_parser.release_identity import VERSION, BUILD_ID, API_CONTRACT
          d=json.load(open('VERSION.json'))
          assert d['version']==VERSION
          assert d['build_id']==BUILD_ID
          assert d['api_contract']==API_CONTRACT
          assert d['identity_source']=='src/generic_parser/release_identity.py'
          package=open('pyproject.toml').read()
          assert 'dynamic = ["version"]' in package
          assert 'generic_parser.release_identity.VERSION' in package
          compat=open('src/generic_parser/build_identity_v0452.py').read()
          assert 'from .release_identity import' in compat
          controller=open('cloudflare/public/controller-0450.js').read()
          assert 'exactVersionMatchRequired:false' in controller
          PY
