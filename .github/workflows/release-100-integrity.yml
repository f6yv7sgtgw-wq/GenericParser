name: GenericParser 1.1.1 integrity

on:
  pull_request:
    paths:
      - "src/**"
      - "cloudflare/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - "VERSION.json"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  release-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install project and tests
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Prove stable Kleinanzeigen core and module contract are unchanged
        run: |
          git diff --exit-code origin/main -- \
            src/generic_parser/search_service_v0444.py \
            src/generic_parser/module_api.py \
            src/generic_parser/search_service_v0450.py \
            src/generic_parser/vinted_adapter.py
      - name: Compile active runtime, bridge and marketplace adapter
        run: python -m py_compile src/generic_parser/build_identity_v0450.py src/generic_parser/build_identity_v0452.py src/generic_parser/cloudflare_v0450.py src/generic_parser/cloudflare_v0452.py src/generic_parser/search_service_v0450.py src/generic_parser/search_service_v111_runtime.py src/generic_parser/vinted_adapter.py scripts/check_deployment.py
      - name: Check browser syntax
        run: |
          node --check cloudflare/public/controller-0450.js
          node --check cloudflare/public/source-colors-110.js
      - name: Run stable, bridge and multi-source regression tests
        run: pytest -q tests/test_release_100.py tests/test_search_service_v0444.py tests/test_vinted_multi_source.py
      - name: Validate 1.1.1 metadata and runtime separation
        shell: bash
        run: |
          grep -q '"version": "1.1.1"' VERSION.json
          grep -q '"build_id": "gp-111-20260808-1"' VERSION.json
          grep -q 'version = "1.1.1"' pyproject.toml
          grep -q 'VERSION = "1.1.1"' src/generic_parser/build_identity_v0452.py
          grep -q 'VERSION = "0.45.0"' src/generic_parser/build_identity_v0450.py
          grep -q 'SEARCH_MODULE = "generic_parser.search_service_v111_runtime"' src/generic_parser/build_identity_v0450.py
          grep -q "version:'1.1.1'" cloudflare/public/build-identity-0450.js
          grep -q 'GenericParser 1.1.1' cloudflare/public/index.html
          grep -q 'from .search_service_v0450 import' src/generic_parser/search_service_v111_runtime.py
