name: GenericParser 1.0.0 integrity

on:
  pull_request:
    paths:
      - "src/**"
      - "cloudflare/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - "VERSION.json"
      - "README.md"
      - "ROADMAP.md"
      - "CHANGELOG.md"
      - "docs/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  release-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install project and tests
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Prove functional search core is unchanged
        run: |
          git diff --exit-code origin/main -- \
            src/generic_parser/search_service_v0450.py \
            src/generic_parser/search_service_v0444.py \
            src/generic_parser/module_api.py
      - name: Compile active runtime
        run: python -m py_compile src/generic_parser/build_identity_v0452.py src/generic_parser/cloudflare_v0452.py scripts/check_deployment.py
      - name: Check browser syntax
        run: node --check cloudflare/public/controller-0450.js
      - name: Run 1.0.0 release tests
        run: pytest -q tests/test_release_100.py tests/test_search_service_v0444.py
      - name: Validate release metadata consistency
        shell: bash
        run: |
          grep -q '"version": "1.0.0"' VERSION.json
          grep -q '"build_id": "gp-100-20260808-1"' VERSION.json
          grep -q '"status": "stable"' VERSION.json
          grep -q 'version = "1.0.0"' pyproject.toml
          grep -q 'VERSION = "1.0.0"' src/generic_parser/build_identity_v0452.py
          grep -q "version:'1.0.0'" cloudflare/public/build-identity-0450.js
          grep -q 'GenericParser 1.0.0' README.md
          grep -q '## 1.0.0' CHANGELOG.md
          grep -q '## 1.0.0' ROADMAP.md
