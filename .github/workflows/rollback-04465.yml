name: GenericParser 0.44.6.5 clean rollback

on:
  workflow_dispatch:

jobs:
  clean-rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: python -m pip install -U pip pytest fastapi pydantic httpx beautifulsoup4 PyYAML
      - name: Compile active Python modules
        run: |
          python -m py_compile \
            src/generic_parser/cloudflare_worker.py \
            src/generic_parser/cloudflare_v04465.py \
            src/generic_parser/search_service_v04465.py \
            src/generic_parser/build_identity_v04465.py
      - name: Check active browser scripts
        run: |
          node --check cloudflare/public/controller-04465.js
          node --check cloudflare/public/auto-resume-04465.js
          node --check cloudflare/public/eventlog-04465.js
          node --check cloudflare/public/build-identity-04465.js
      - name: Run clean rollback tests
        run: pytest -q tests/test_clean_rollback_v04465.py
