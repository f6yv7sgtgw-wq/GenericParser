name: Deploy GenericParser

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cloudflare/**"
      - "pocs/ebay-notifications/**"
      - "src/generic_parser/**"
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - "VERSION.json"
      - "wrangler.jsonc"
      - ".github/workflows/cloudflare-deploy.yml"

concurrency:
  group: generic-parser-production
  cancel-in-progress: false
permissions:
  contents: read
env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
  EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
  EBAY_DELETION_VERIFICATION_TOKEN: ${{ secrets.EBAY_DELETION_VERIFICATION_TOKEN }}
  DEPLOYMENT_URL: https://genericparser.f6yv7sgtgw.workers.dev
  EBAY_DELETION_COMPONENT_URL: https://genericparser-ebay-notifications.f6yv7sgtgw.workers.dev
  EBAY_DELETION_ENDPOINT_URL: https://genericparser-ebay-notifications.f6yv7sgtgw.workers.dev/marketplace-account-deletion

jobs:
  test-deploy-live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with: {enable-cache: true}
      - uses: actions/setup-node@v6
        with: {node-version: "22"}
      - name: Install dependencies
        run: uv sync --group cloudflare --extra dev
      - name: Read active release identity
        id: release
        run: |
          echo "version=$(uv run python -c 'from generic_parser.release_identity import VERSION; print(VERSION)')" >> "$GITHUB_OUTPUT"
          echo "build=$(uv run python -c 'from generic_parser.release_identity import BUILD_ID; print(BUILD_ID)')" >> "$GITHUB_OUTPUT"
          echo "contract=$(uv run python -c 'from generic_parser.release_identity import API_CONTRACT; print(API_CONTRACT)')" >> "$GITHUB_OUTPUT"
      - name: Run regression tests
        run: uv run pytest -q tests/test_release_100.py tests/test_release_132.py tests/test_release_133.py tests/test_release_134.py tests/test_release_140.py tests/test_release_150.py tests/test_release_151.py tests/test_release_160.py tests/test_search_service_v0444.py tests/test_vinted_multi_source.py tests/test_vinted_browser_production.py tests/test_vinted_service_binding_122.py tests/test_ebay_adapter.py tests/test_ebay_multi_source.py tests/test_product_classification.py
      - name: Compile active runtime
        run: uv run python -m py_compile src/generic_parser/release_identity.py src/generic_parser/module_api_v2.py src/generic_parser/cloudflare_worker.py src/generic_parser/cloudflare_v0450.py src/generic_parser/cloudflare_v0452.py src/generic_parser/build_identity_v0450.py src/generic_parser/build_identity_v0452.py src/generic_parser/search_service_v0450.py src/generic_parser/search_service_v111_runtime.py src/generic_parser/vinted_adapter.py src/generic_parser/vinted_enrichment.py src/generic_parser/ebay_adapter.py src/generic_parser/product_classification.py scripts/check_deployment.py
      - name: Validate browser controller syntax
        run: |
          node --check cloudflare/public/controller-0450.js
          node --check cloudflare/public/app.js
          node --check cloudflare/public/eventlog-0450.js
          node --check cloudflare/public/service-worker.js
          node --check cloudflare/public/vinted-background-132.js
          node --check cloudflare/public/ui-160.js
          node --check cloudflare/public/source-colors-110.js
          node --check cloudflare/public/source-colors-140.js
          node --check cloudflare/public/favorites-store-150.js
          node --check cloudflare/public/favorites-150.js
          node --test tests/js/favorites-store-150.test.mjs
          node --test tests/js/ui-160.test.mjs
          node --check pocs/ebay-notifications/src/index.js
          node --test pocs/ebay-notifications/test/*.test.js
          node --check pocs/vinted-browser/src/index.js
      - name: Validate release metadata and service binding
        run: |
          uv run python - <<'PY'
          import json
          from generic_parser.release_identity import VERSION,BUILD_ID,API_CONTRACT
          d=json.load(open('VERSION.json')); w=json.load(open('wrangler.jsonc'))
          assert d['version']==VERSION and d['build_id']==BUILD_ID and d['api_contract']==API_CONTRACT
          assert d['preferred_module_contract']=='generic-parser-module-v2'
          json.load(open('docs/openapi-module-v2.json'))
          services={x.get('binding'):x.get('service') for x in w.get('services',[])}
          assert services.get('VINTED_BROWSER')=='genericparser-vinted-poc'
          PY
      - name: Validate production secrets
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$EBAY_CLIENT_ID"
          test -n "$EBAY_CLIENT_SECRET"
          python - <<'PY'
          import os,re
          token=os.environ.get('EBAY_DELETION_VERIFICATION_TOKEN','')
          assert re.fullmatch(r'[A-Za-z0-9_-]{32,80}',token), 'EBAY_DELETION_VERIFICATION_TOKEN must contain 32-80 allowed characters'
          PY
      - name: Deploy Vinted Browser component
        working-directory: pocs/vinted-browser
        run: |
          npm install --no-audit --no-fund
          npx wrangler deploy --name genericparser-vinted-poc --var REVISION:${GITHUB_SHA}
      - name: Sync encrypted eBay secrets to production Worker
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$EBAY_CLIENT_ID" | uv run --group cloudflare pywrangler secret put EBAY_CLIENT_ID
          printf '%s\n' "$EBAY_CLIENT_SECRET" | uv run --group cloudflare pywrangler secret put EBAY_CLIENT_SECRET
      - name: Deploy signed eBay account-deletion endpoint
        working-directory: pocs/ebay-notifications
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npx wrangler deploy
          printf '%s\n' "$EBAY_CLIENT_ID" | npx wrangler secret put EBAY_CLIENT_ID
          printf '%s\n' "$EBAY_CLIENT_SECRET" | npx wrangler secret put EBAY_CLIENT_SECRET
          printf '%s\n' "$EBAY_DELETION_VERIFICATION_TOKEN" | npx wrangler secret put EBAY_DELETION_VERIFICATION_TOKEN
          npx wrangler deploy
      - name: Verify eBay endpoint health and challenge contract
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
          EXPECTED_BUILD: ${{ steps.release.outputs.build }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            code="$(curl -sS -o /tmp/ebay-deletion-health.json -w '%{http_code}' --max-time 20 "$EBAY_DELETION_COMPONENT_URL/health" || true)"
            python - "$code" <<'PY' && break || true
          import json,os,sys
          try: d=json.load(open('/tmp/ebay-deletion-health.json'))
          except Exception: raise SystemExit(1)
          ok=(sys.argv[1]=='200' and d.get('status')=='ok' and d.get('version')==os.environ['EXPECTED_VERSION'] and d.get('challenge_ready') is True and d.get('signature_verification')=='ecdsa-public-key-api')
          raise SystemExit(0 if ok else 1)
          PY
            if [ "$attempt" -eq 24 ]; then
              cat /tmp/ebay-deletion-health.json || true
              exit 1
            fi
            sleep 10
          done
          challenge="${EXPECTED_BUILD}-production-gate"
          for attempt in $(seq 1 12); do
            code="$(curl -sS -o /tmp/ebay-challenge.json -w '%{http_code}' --max-time 20 "$EBAY_DELETION_ENDPOINT_URL?challenge_code=$challenge" || true)"
            CHALLENGE="$challenge" python - "$code" <<'PY' && break || true
          import hashlib,json,os,sys
          try: d=json.load(open('/tmp/ebay-challenge.json'))
          except Exception: raise SystemExit(1)
          expected=hashlib.sha256((os.environ['CHALLENGE']+os.environ['EBAY_DELETION_VERIFICATION_TOKEN']+os.environ['EBAY_DELETION_ENDPOINT_URL']).encode()).hexdigest()
          raise SystemExit(0 if sys.argv[1]=='200' and d.get('challengeResponse')==expected else 1)
          PY
            if [ "$attempt" -eq 12 ]; then
              cat /tmp/ebay-challenge.json || true
              exit 1
            fi
            sleep 5
          done
      - name: Deploy Python Worker
        run: uv run --group cloudflare pywrangler deploy
      - name: Verify live release identity and eBay secret bindings
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
          EXPECTED_BUILD: ${{ steps.release.outputs.build }}
          EXPECTED_CONTRACT: ${{ steps.release.outputs.contract }}
        run: |
          set -euo pipefail
          for i in $(seq 1 24); do
            code="$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 15 "$DEPLOYMENT_URL/health" || true)"
            python - "$code" <<'PY' && exit 0 || true
          import json,os,sys
          try: d=json.load(open('/tmp/health.json'))
          except Exception: raise SystemExit(1)
          ok=(sys.argv[1]=='200' and d.get('version')==os.environ['EXPECTED_VERSION'] and d.get('build_id')==os.environ['EXPECTED_BUILD'] and d.get('api_contract')==os.environ['EXPECTED_CONTRACT'] and d.get('ebay_credentials_configured') is True)
          raise SystemExit(0 if ok else 1)
          PY
            sleep 10
          done
          cat /tmp/health.json || true
          exit 1
      - name: Verify live module API v2 contract and packet
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 "$DEPLOYMENT_URL/api/module/v2/capabilities" -o /tmp/v2-capabilities.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/v2-capabilities.json'))
          assert d['contract']=='generic-parser-module-v2'
          assert d['previous_contract']=='generic-parser-module-v1'
          assert d['packet_model']=='one-source-page-per-request'
          assert d['continuation']['signed'] is True
          assert d['persistent_server_jobs'] is False
          PY
          cat > /tmp/v2-search.json <<'JSON'
          {"contract":"generic-parser-module-v2","batch_id":"production-v2-gate","client":{"project_id":"genericparser-deploy-gate","project_version":"workflow"},"search":{"search_id":"evercade-ebay","query":"Evercade","sources":["ebay"],"criteria":{"required_terms":[],"excluded_terms":[],"model_patterns":[],"brands":[]},"filters":{"max_price":null,"accept_bundles":false,"accept_incomplete":false,"include_auctions":false,"include_review":true,"include_rejected":true},"location":{},"sort_by":"relevance"},"debug":{"enabled":false}}
          JSON
          code="$(curl -sS -o /tmp/v2-result.json -w '%{http_code}' --max-time 90 -H 'Content-Type: application/json' -d @/tmp/v2-search.json "$DEPLOYMENT_URL/api/module/v2/search" || true)"
          python - "$code" <<'PY'
          import json,sys
          d=json.load(open('/tmp/v2-result.json'))
          packet=(d.get('results') or [{}])[0]; listings=packet.get('listings') or []
          source=(packet.get('sources') or {}).get('ebay') or {}
          keys_ok=all(x.get('listing_key')==f"ebay:{x.get('source_id')}" for x in listings)
          seller_free=all('seller' not in json.dumps(x).casefold() for x in listings)
          totals_ok=all((x.get('pricing') or {}).get('total_known') is ((x.get('pricing') or {}).get('total') is not None) for x in listings)
          ok=(sys.argv[1]=='200' and d.get('contract')=='generic-parser-module-v2' and d.get('status') in {'partial','complete'} and packet.get('source')=='ebay' and source.get('status')=='ok' and len(listings)>0 and keys_ok and seller_free and totals_ok)
          print('v2_status=',d.get('status'),'source=',source,'listings=',len(listings),'continuation=',bool(d.get('continuation_token')))
          raise SystemExit(0 if ok else 1)
          PY
      - name: Verify live Kleinanzeigen, Vinted and official eBay Browse search
        run: |
          set -euo pipefail
          cat > /tmp/search.json <<'JSON'
          {"mode":"live","query":"Evercade","page":0,"source":"auto","include_review":true,"include_rejected":true}
          JSON
          for i in $(seq 1 8); do
            code="$(curl -sS -o /tmp/result.json -w '%{http_code}' --max-time 90 -H 'Content-Type: application/json' -d @/tmp/search.json "$DEPLOYMENT_URL/search" || true)"
            python - "$code" <<'PY' && exit 0 || true
          import json,sys
          try: d=json.load(open('/tmp/result.json'))
          except Exception: raise SystemExit(1)
          status=d.get('source_status') or (d.get('summary') or {}).get('sources') or {}
          ka=status.get('kleinanzeigen') or {}; vi=status.get('vinted') or {}; eb=status.get('ebay') or {}; listings=d.get('listings') or []
          vinted=[x for x in listings if x.get('source')=='vinted' or str(x.get('id','')).startswith('vinted:')]
          ebay_listings=[x for x in listings if x.get('source')=='ebay' or str(x.get('id','')).startswith('ebay:')]
          classified=[x for x in listings if (x.get('product_classification') or {}).get('ruleset')=='product-classification-v1']
          priced=[x for x in ebay_listings if x.get('item_price') is not None]
          totals=[x for x in ebay_listings if x.get('total_price') is not None]
          totals_valid=all(x.get('price')==x.get('total_price') for x in totals)
          fixed_price_only=all(x.get('auction') is False for x in ebay_listings)
          forbidden={'seller','sellerusername','sellerid','username','userid','eiastoken','feedbackscore'}
          def keys(value):
              if isinstance(value,dict):
                  for key,item in value.items():
                      yield ''.join(ch for ch in str(key).casefold() if ch.isalnum())
                      yield from keys(item)
              elif isinstance(value,list):
                  for item in value: yield from keys(item)
          ebay_has_no_seller_data=all(not (set(keys(item)) & forbidden) for item in ebay_listings)
          all_classified=len(classified)==len(listings) and len(listings)>0
          ok=(sys.argv[1]=='200' and ka.get('enabled') is True and vi.get('enabled') is True and vi.get('status')=='ok' and vi.get('strategy')=='service-binding' and len(vinted)>0 and eb.get('enabled') is True and eb.get('status')=='ok' and eb.get('strategy')=='official-browse-api' and eb.get('marketplace')=='EBAY_DE' and eb.get('include_auctions') is False and len(ebay_listings)>0 and len(priced)>0 and totals_valid and fixed_price_only and all_classified and ebay_has_no_seller_data)
          print('kleinanzeigen=',ka); print('vinted=',vi); print('ebay=',eb)
          print('vinted_listings=',len(vinted)); print('ebay_listings=',len(ebay_listings),'known_totals=',len(totals))
          print('classified=',len(classified),'all_classified=',all_classified,'ebay_has_no_seller_data=',ebay_has_no_seller_data)
          raise SystemExit(0 if ok else 1)
          PY
            sleep 10
          done
          cat /tmp/result.json || true
          exit 1
      - name: Verify live deferred Vinted detail batch
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          source=json.load(open('/tmp/result.json'))
          vinted=[x for x in source.get('listings',[]) if x.get('source')=='vinted' and x.get('url')]
          missing=[x for x in vinted if not (x.get('image_url') and x.get('price') is not None and x.get('description'))]
          listings=(missing or vinted)[:3]
          if not listings: raise SystemExit('no Vinted listings available for deferred detail gate')
          search={"mode":"live","query":"Evercade","page":0,"source":"vinted","include_review":True,"include_rejected":True}
          json.dump({"search":search,"listings":listings},open('/tmp/enrich-request.json','w'))
          PY
          code="$(curl -sS -o /tmp/enrich-result.json -w '%{http_code}' --max-time 60 -H 'Content-Type: application/json' -d @/tmp/enrich-request.json "$DEPLOYMENT_URL/api/vinted/enrich" || true)"
          python - "$code" <<'PY'
          import json,sys
          d=json.load(open('/tmp/enrich-result.json')); rows=d.get('listings') or []
          complete=[x for x in rows if x.get('image_url') and x.get('price') is not None and x.get('description')]
          classified=all((x.get('product_classification') or {}).get('ruleset')=='product-classification-v1' for x in rows)
          ok=(sys.argv[1]=='200' and d.get('status')=='ok' and d.get('strategy')=='service-binding-deferred-detail' and d.get('detail_batch_limit')==3 and len(rows)>0 and len(complete)>0 and classified)
          print('requested=',d.get('requested'),'complete=',len(complete),'partial=',d.get('partial'),'failed=',d.get('failed'))
          raise SystemExit(0 if ok else 1)
          PY
