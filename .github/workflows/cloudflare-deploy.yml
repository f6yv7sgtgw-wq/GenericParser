name: Deploy GenericParser 0.45.0

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cloudflare/**"
      - "src/generic_parser/**"
      - "scripts/check_deployment.py"
      - "scripts/check_release_metadata.py"
      - "scripts/run_release_tests.py"
      - "tests/**"
      - "pyproject.toml"
      - "wrangler.jsonc"
      - ".github/workflows/cloudflare-deploy.yml"

concurrency:
  group: generic-parser-mobile-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install dependencies
        run: uv sync --group cloudflare --extra dev
      - name: Validate release metadata
        run: uv run python scripts/check_release_metadata.py
      - name: Run current release regression suite
        run: uv run python scripts/run_release_tests.py
      - name: Check active browser assets
        run: |
          node --check cloudflare/public/build-identity-0450.js
          node --check cloudflare/public/controller-0450.js
          node --check cloudflare/public/module-debug-0450.js
          node --check cloudflare/public/auto-resume-0450.js
          node --check cloudflare/public/eventlog-0450.js
          node --check cloudflare/public/service-worker.js
          node tests/check_module_debug_v0450.js
      - name: Normalize and validate Cloudflare credentials
        shell: bash
        run: |
          normalize_credential() {
            local name="$1"
            local raw="${!name-}"
            local normalized
            normalized="$(printf '%s' "$raw" | tr -d '[:space:]')"
            test -n "$normalized" || { echo "$name fehlt"; exit 1; }
            echo "::add-mask::$normalized"
            printf '%s=%s\n' "$name" "$normalized" >> "$GITHUB_ENV"
          }
          normalize_credential CLOUDFLARE_ACCOUNT_ID
          normalize_credential CLOUDFLARE_API_TOKEN
      - name: Deploy exact tested commit
        id: deploy
        env:
          CONFIGURED_URL: ${{ vars.CLOUDFLARE_WORKER_URL }}
        shell: bash
        run: |
          set -o pipefail
          deploy_log="${RUNNER_TEMP}/genericparser-deploy.log"
          uv run --group cloudflare pywrangler deploy 2>&1 | tee "$deploy_log"
          discovered_url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' "$deploy_log" | tail -n 1 || true)"
          deployment_url="${CONFIGURED_URL:-$discovered_url}"
          test -n "$deployment_url" || { echo "Keine Cloudflare-Deployment-URL ermittelt"; exit 1; }
          case "$deployment_url" in
            https://*) ;;
            *) echo "Deployment-URL ist nicht HTTPS: $deployment_url"; exit 1 ;;
          esac
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
      - name: Smoke-test deployed contract and one live packet
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
          CLOUDFLARE_LIVE_QUERY: ${{ vars.CLOUDFLARE_LIVE_QUERY }}
        run: uv run python scripts/check_deployment.py "$DEPLOYMENT_URL" --live-search
