name: Deploy GenericParser

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cloudflare/**"
      - "src/generic_parser/**"
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - "VERSION.json"
      - "wrangler.jsonc"
      - ".github/workflows/cloudflare-deploy.yml"

concurrency:
  group: generic-parser-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  DEPLOYMENT_URL: https://genericparser.f6yv7sgtgw.workers.dev

jobs:
  test-deploy-live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with: {enable-cache: true}
      - uses: actions/setup-node@v6
        with: {node-version: "22"}
      - name: Install dependencies
        run: uv sync --group cloudflare --extra dev
      - name: Read active release identity
        id: release
        run: |
          echo "version=$(uv run python -c 'from generic_parser.release_identity import VERSION; print(VERSION)')" >> "$GITHUB_OUTPUT"
          echo "build=$(uv run python -c 'from generic_parser.release_identity import BUILD_ID; print(BUILD_ID)')" >> "$GITHUB_OUTPUT"
          echo "contract=$(uv run python -c 'from generic_parser.release_identity import API_CONTRACT; print(API_CONTRACT)')" >> "$GITHUB_OUTPUT"
      - name: Run regression tests
        run: uv run pytest -q tests/test_release_100.py tests/test_search_service_v0444.py tests/test_vinted_multi_source.py
      - name: Compile active runtime
        run: |
          uv run python -m py_compile src/generic_parser/release_identity.py src/generic_parser/cloudflare_worker.py src/generic_parser/cloudflare_v0450.py src/generic_parser/cloudflare_v0452.py src/generic_parser/build_identity_v0450.py src/generic_parser/build_identity_v0452.py src/generic_parser/search_service_v0450.py src/generic_parser/search_service_v111_runtime.py src/generic_parser/vinted_adapter.py scripts/check_deployment.py
      - name: Validate browser controller syntax
        run: |
          node --check cloudflare/public/controller-0450.js
          node --check cloudflare/public/source-colors-110.js
      - name: Validate release metadata without hard version literals
        run: |
          uv run python - <<'PY'
          import json
          from generic_parser.release_identity import VERSION, BUILD_ID, API_CONTRACT
          d=json.load(open('VERSION.json'))
          assert d['version']==VERSION
          assert d['build_id']==BUILD_ID
          assert d['api_contract']==API_CONTRACT
          assert d['identity_source']=='src/generic_parser/release_identity.py'
          PY
      - name: Validate production secrets
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
      - name: Deploy Python Worker
        run: uv run --group cloudflare pywrangler deploy
      - name: Verify live release identity
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
          EXPECTED_BUILD: ${{ steps.release.outputs.build }}
          EXPECTED_CONTRACT: ${{ steps.release.outputs.contract }}
        run: |
          set -euo pipefail
          for i in $(seq 1 24); do
            code="$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 15 "$DEPLOYMENT_URL/health" || true)"
            python - "$code" <<'PY' && exit 0 || true
          import json,os,sys
          try: d=json.load(open('/tmp/health.json'))
          except Exception: raise SystemExit(1)
          ok=(sys.argv[1]=='200' and d.get('version')==os.environ['EXPECTED_VERSION'] and d.get('build_id')==os.environ['EXPECTED_BUILD'] and d.get('api_contract')==os.environ['EXPECTED_CONTRACT'])
          raise SystemExit(0 if ok else 1)
          PY
            sleep 10
          done
          cat /tmp/health.json || true
          exit 1
