name: GenericParser 0.45 module contract

on:
  push:
    branches: [main]
    paths:
      - 'VERSION.json'
      - 'pyproject.toml'
      - 'src/generic_parser/__init__.py'
      - 'src/generic_parser/module_api.py'
      - 'src/generic_parser/integrations/**'
      - 'src/generic_parser/build_identity_v0450.py'
      - 'src/generic_parser/search_service_v0450.py'
      - 'src/generic_parser/cloudflare_v0450.py'
      - 'src/generic_parser/cloudflare_worker.py'
      - 'cloudflare/public/build-identity-0450.js'
      - 'cloudflare/public/controller-0450.js'
      - 'cloudflare/public/module-debug-0450.js'
      - 'cloudflare/public/auto-resume-0450.js'
      - 'cloudflare/public/eventlog-0450.js'
      - 'cloudflare/public/index.html'
      - 'cloudflare/public/eventlog.html'
      - 'tests/test_module_v0450.py'
      - 'tests/check_module_debug_v0450.js'
      - '.github/workflows/module-0450.yml'
  workflow_dispatch:

jobs:
  module-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: python -m pip install -U pip pytest fastapi pydantic httpx beautifulsoup4 PyYAML
      - name: Compile 0.45 Python modules
        run: |
          python -m py_compile \
            src/generic_parser/module_api.py \
            src/generic_parser/integrations/__init__.py \
            src/generic_parser/integrations/evercade.py \
            src/generic_parser/integrations/snes.py \
            src/generic_parser/build_identity_v0450.py \
            src/generic_parser/search_service_v0450.py \
            src/generic_parser/cloudflare_v0450.py \
            src/generic_parser/cloudflare_worker.py
      - name: Check browser assets
        run: |
          node --check cloudflare/public/build-identity-0450.js
          node --check cloudflare/public/controller-0450.js
          node --check cloudflare/public/module-debug-0450.js
          node --check cloudflare/public/auto-resume-0450.js
          node --check cloudflare/public/eventlog-0450.js
          node tests/check_module_debug_v0450.js
      - name: Run module regressions
        run: pytest -q tests/test_module_v0450.py
