name: Vinted Browser PoC

on:
  pull_request:
    paths:
      - "pocs/vinted-browser/**"
      - ".github/workflows/vinted-browser-poc.yml"
  push:
    branches: [main]
    paths:
      - "pocs/vinted-browser/**"
      - ".github/workflows/vinted-browser-poc.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  POC_DIR: pocs/vinted-browser
  EXPECTED_POC_URL: https://genericparser-vinted-poc.f6yv7sgtgw.workers.dev

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: {node-version: "22"}
      - name: Install PoC dependencies
        working-directory: ${{ env.POC_DIR }}
        run: npm install --no-audit --no-fund
      - name: Check Worker syntax
        working-directory: ${{ env.POC_DIR }}
        run: npm run check
      - name: Validate Wrangler configuration
        working-directory: ${{ env.POC_DIR }}
        run: npx wrangler deploy --dry-run --outdir ../../.poc-dist --name genericparser-vinted-poc

  deploy-and-probe:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: {node-version: "22"}
      - name: Install PoC dependencies
        working-directory: ${{ env.POC_DIR }}
        run: npm install --no-audit --no-fund
      - name: Validate Cloudflare production credentials
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
      - name: Deploy isolated Browser Run worker
        id: deploy
        working-directory: ${{ env.POC_DIR }}
        run: |
          set -euo pipefail
          npx wrangler deploy --name genericparser-vinted-poc --var REVISION:${GITHUB_SHA} 2>&1 | tee /tmp/vinted-poc-deploy.log
          grep -q 'genericparser-vinted-poc' /tmp/vinted-poc-deploy.log
          DEPLOY_URL="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/vinted-poc-deploy.log | tail -n1 || true)"
          [ -n "$DEPLOY_URL" ] || DEPLOY_URL="$EXPECTED_POC_URL"
          echo "deploy_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
      - name: Wait for PoC health
        env: {POC_URL: "${{ steps.deploy.outputs.deploy_url }}"}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            code="$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 15 "$POC_URL/health" || true)"
            python - "$code" "$GITHUB_SHA" <<'PY' && exit 0 || true
          import json,sys
          code,sha=sys.argv[1:]
          try: d=json.load(open('/tmp/health.json'))
          except Exception: raise SystemExit(1)
          ok=(code=='200' and d.get('component')=='vinted-browser-poc' and d.get('schema')==2 and d.get('status')=='ok' and d.get('revision')==sha and d.get('detailEnrichment') is True and d.get('deferredDetailEnrichment') is True and d.get('detailBatchLimit')==3)
          raise SystemExit(0 if ok else 1)
          PY
            sleep 5
          done
          cat /tmp/health.json || true
          exit 1
      - name: Probe Vinted catalog plus detail enrichment
        env: {POC_URL: "${{ steps.deploy.outputs.deploy_url }}"}
        run: |
          set -euo pipefail
          http_code="$(curl -sS --max-time 120 "$POC_URL/search?q=Evercade" -o /tmp/vinted-poc.json -w '%{http_code}')"
          cat /tmp/vinted-poc.json
          python - "$http_code" "$GITHUB_SHA" <<'PY'
          import json,sys
          code,sha=sys.argv[1:]
          d=json.load(open('/tmp/vinted-poc.json'))
          listings=d.get('listings') or []; e=d.get('enrichment') or {}
          enriched=int(e.get('images') or 0)+int(e.get('prices') or 0)+int(e.get('descriptions') or 0)
          print('status=',d.get('status'),'browser=',d.get('browser'),'listings=',len(listings),'enrichment=',e)
          ok=(code=='200' and d.get('component')=='vinted-browser-poc' and d.get('revision')==sha and d.get('status')=='ok' and bool(listings) and int(e.get('requested') or 0)>0 and enriched>0)
          raise SystemExit(0 if ok else 1)
          PY
      - name: Probe deferred three-item detail endpoint
        env: {POC_URL: "${{ steps.deploy.outputs.deploy_url }}"}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,urllib.parse
          d=json.load(open('/tmp/vinted-poc.json'))
          rows=[x for x in d.get('listings',[]) if x.get('url')]
          deferred=[x for x in rows if x.get('detail_status')=='skipped_budget']
          urls=[x.get('url') for x in (deferred or rows)[:3]]
          if not urls: raise SystemExit('no item URLs returned by catalog probe')
          open('/tmp/vinted-detail-url.txt','w').write('/enrich?'+urllib.parse.urlencode([('item',x) for x in urls]))
          PY
          detail_path="$(cat /tmp/vinted-detail-url.txt)"
          http_code="$(curl -sS --max-time 60 "$POC_URL$detail_path" -o /tmp/vinted-detail.json -w '%{http_code}')"
          cat /tmp/vinted-detail.json
          python - "$http_code" "$GITHUB_SHA" <<'PY'
          import json,sys
          code,sha=sys.argv[1:]
          d=json.load(open('/tmp/vinted-detail.json')); rows=d.get('listings') or []
          complete=[x for x in rows if x.get('image_url') and x.get('price') is not None and x.get('description')]
          ok=(code=='200' and d.get('component')=='vinted-browser-poc' and d.get('revision')==sha and d.get('status')=='ok' and d.get('mode')=='deferred-detail-batch' and d.get('detailBatchLimit')==3 and len(complete)>0)
          raise SystemExit(0 if ok else 1)
          PY
