name: Vinted Browser PoC

on:
  pull_request:
    paths:
      - "pocs/vinted-browser/**"
      - ".github/workflows/vinted-browser-poc.yml"
  push:
    branches: [main]
    paths:
      - "pocs/vinted-browser/**"
      - ".github/workflows/vinted-browser-poc.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  POC_DIR: pocs/vinted-browser
  EXPECTED_POC_URL: https://genericparser-vinted-poc.f6yv7sgtgw.workers.dev

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install PoC dependencies
        working-directory: ${{ env.POC_DIR }}
        run: npm install --no-audit --no-fund
      - name: Check Worker syntax
        working-directory: ${{ env.POC_DIR }}
        run: npm run check
      - name: Validate Wrangler configuration
        working-directory: ${{ env.POC_DIR }}
        run: npx wrangler deploy --dry-run --outdir ../../.poc-dist --name genericparser-vinted-poc

  deploy-and-probe:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install PoC dependencies
        working-directory: ${{ env.POC_DIR }}
        run: npm install --no-audit --no-fund
      - name: Validate Cloudflare production credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID fehlt"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN fehlt"; exit 1; }
          echo "Cloudflare production credentials available"
      - name: Deploy isolated Browser Run worker
        id: deploy
        working-directory: ${{ env.POC_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --name genericparser-vinted-poc 2>&1 | tee /tmp/vinted-poc-deploy.log
          grep -q 'genericparser-vinted-poc' /tmp/vinted-poc-deploy.log || {
            echo "Wrangler output did not confirm genericparser-vinted-poc"
            cat /tmp/vinted-poc-deploy.log
            exit 1
          }
          DEPLOY_URL="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/vinted-poc-deploy.log | tail -n1 || true)"
          if [ -z "$DEPLOY_URL" ]; then
            DEPLOY_URL="$EXPECTED_POC_URL"
          fi
          echo "deploy_url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "Using PoC URL: $DEPLOY_URL"
      - name: Wait for PoC health
        shell: bash
        env:
          POC_URL: ${{ steps.deploy.outputs.deploy_url }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            code="$(curl -sS -o /tmp/vinted-poc-health.json -w '%{http_code}' --max-time 15 "$POC_URL/health" || true)"
            body="$(cat /tmp/vinted-poc-health.json 2>/dev/null || true)"
            echo "health attempt $i: HTTP $code $body"
            if [ "$code" = "200" ] && printf '%s' "$body" | grep -Eq '"poc"[[:space:]]*:[[:space:]]*"vinted-browser-poc-0\.2\.[0-9]+"'; then
              echo "PoC health endpoint ready at $POC_URL"
              exit 0
            fi
            sleep 5
          done
          echo "PoC health endpoint not ready at $POC_URL/health"
          exit 1
      - name: Probe Vinted Browser Run Quick Action
        shell: bash
        env:
          POC_URL: ${{ steps.deploy.outputs.deploy_url }}
        run: |
          set -euo pipefail
          http_code="$(curl -sS --max-time 60 "$POC_URL/search?q=Evercade" -o /tmp/vinted-poc.json -w '%{http_code}')"
          echo "PoC endpoint HTTP $http_code"
          cat /tmp/vinted-poc.json
          test "$http_code" = "200" || { echo "PoC search endpoint returned HTTP $http_code"; exit 1; }
          python - <<'PY'
          import json
          data=json.load(open('/tmp/vinted-poc.json'))
          print('POC_STATUS=', data.get('status'))
          print('HTTP_STATUS=', data.get('httpStatus'))
          print('BROWSER=', data.get('browser'))
          print('LISTINGS=', len(data.get('listings') or []))
          if data.get('status') != 'ok' or not data.get('listings'):
              raise SystemExit('Browser Run Quick Action did not obtain public Vinted listings; see diagnostics above')
          PY
